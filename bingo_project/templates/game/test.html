<!DOCTYPE html>
<html class="light" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Game Settings</title>
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&amp;display=swap"
            rel="stylesheet"
        />
        <!-- Material Symbols -->
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
            rel="stylesheet"
        />
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <!-- Theme Config -->
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            primary: "#258cf4",
                            "primary-dark": "#1a6bc0",
                            "background-light": "#f5f7f8",
                            "background-dark": "#101922",
                        },
                        fontFamily: {
                            display: ["Spline Sans", "sans-serif"],
                            body: ["Noto Sans", "sans-serif"],
                        },
                        borderRadius: {
                            DEFAULT: "0.5rem",
                            lg: "1rem",
                            xl: "1.5rem",
                            full: "9999px",
                        },
                    },
                },
            };
        </script>
    </head>
    <body
        class="font-display bg-background-light dark:bg-background-dark text-[#111418] antialiased"
    >
        <!-- Main Backdrop / Page Container -->
        <div
            class="relative flex min-h-screen w-full flex-col items-center justify-center p-4"
        >
            <!-- Blurred Background visual (Simulating game room behind) -->
            <div class="absolute inset-0 z-0 overflow-hidden">
                <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm z-10"></div>
                <!-- Abstract background image to represent game room context -->
                <img
                    alt="Abstract retro game room background with neon lights"
                    class="h-full w-full object-cover opacity-80"
                    data-alt="Abstract retro game room background with neon lights"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAz9jzgUOGuo5cFxJOdDXGF_oe1EgZVbW7t2WPwJCrY9uo2ASrQ4YsOLxedsGkFgWdlfUrOxezIfk59tuIOHIGpwULlCEALe-Lr0evnDUx2cnXzKSZN1DC6-TzZ3WQT3KtsqR1sJ4H5y_e73ZyURzU_u0_9FO6aXuf6sLB0U4OHjEEIn-ecNBegromJYnW3FsN2cm4zUu_BHc8-jqatOXvWSzdbL6pmwuoieaTY5yPaNHm19ZQHPlseEBtKbJ1QsL00omaxn5BDERM"
                />
            </div>
            <!-- Modal Container -->
            <div
                class="relative z-20 w-full max-w-[640px] flex flex-col bg-white rounded-xl shadow-2xl overflow-hidden animate-fade-in-up"
            >
                <!-- Header -->
                <div
                    class="flex items-center justify-between px-6 py-5 border-b border-[#dbe0e6]"
                >
                    <h2 class="text-[#111418] text-xl font-bold leading-tight tracking-tight">
                        Game Settings
                    </h2>
                    <button
                        class="flex items-center justify-center w-8 h-8 rounded-full text-[#60758a] hover:bg-[#f0f2f5] transition-colors"
                    >
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <!-- Content Scroll Area -->
                <div class="flex-1 overflow-y-auto max-h-[70vh] p-6 space-y-8">
                    <!-- Audio Section -->
                    <section class="space-y-4">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="material-symbols-outlined text-primary">volume_up</span>
                            <h3 class="text-[#111418] text-lg font-bold leading-tight">Audio</h3>
                        </div>
                        <!-- Master Volume Slider -->
                        <div class="@container">
                            <div
                                class="relative flex w-full flex-col items-start justify-between gap-3 @[480px]:flex-row @[480px]:items-center"
                            >
                                <div
                                    class="flex w-full shrink-[3] items-center justify-between min-w-[140px]"
                                >
                                    <p class="text-[#111418] text-base font-medium leading-normal">
                                        Master Volume
                                    </p>
                                    <p
                                        class="text-[#111418] text-sm font-normal leading-normal @[480px]:hidden"
                                    >
                                        75%
                                    </p>
                                </div>
                                <div class="flex h-4 w-full items-center gap-4">
                                    <div
                                        class="relative flex h-1.5 flex-1 rounded-full bg-[#e5e8eb] cursor-pointer group"
                                    >
                                        <!-- Active Track -->
                                        <div class="h-full w-[75%] rounded-full bg-primary relative">
                                            <!-- Thumb -->
                                            <div
                                                class="absolute -right-2 top-1/2 -translate-y-1/2 size-5 rounded-full bg-white border-2 border-primary shadow-md group-hover:scale-110 transition-transform"
                                            ></div>
                                        </div>
                                    </div>
                                    <p
                                        class="text-[#111418] text-sm font-bold leading-normal w-9 text-right hidden @[480px]:block"
                                    >
                                        75%
                                    </p>
                                </div>
                            </div>
                        </div>
                        <!-- SFX Slider -->
                        <div class="@container">
                            <div
                                class="relative flex w-full flex-col items-start justify-between gap-3 @[480px]:flex-row @[480px]:items-center"
                            >
                                <div
                                    class="flex w-full shrink-[3] items-center justify-between min-w-[140px]"
                                >
                                    <p class="text-[#111418] text-base font-medium leading-normal">
                                        Sound Effects
                                    </p>
                                    <p
                                        class="text-[#111418] text-sm font-normal leading-normal @[480px]:hidden"
                                    >
                                        50%
                                    </p>
                                </div>
                                <div class="flex h-4 w-full items-center gap-4">
                                    <div
                                        class="relative flex h-1.5 flex-1 rounded-full bg-[#e5e8eb] cursor-pointer group"
                                    >
                                        <!-- Active Track -->
                                        <div class="h-full w-[50%] rounded-full bg-primary relative">
                                            <!-- Thumb -->
                                            <div
                                                class="absolute -right-2 top-1/2 -translate-y-1/2 size-5 rounded-full bg-white border-2 border-primary shadow-md group-hover:scale-110 transition-transform"
                                            ></div>
                                        </div>
                                    </div>
                                    <p
                                        class="text-[#111418] text-sm font-bold leading-normal w-9 text-right hidden @[480px]:block"
                                    >
                                        50%
                                    </p>
                                </div>
                            </div>
                        </div>
                    </section>
                    <hr class="border-[#e5e8eb]" />
                    <!-- Gameplay Section -->
                    <section class="space-y-4">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="material-symbols-outlined text-primary"></span>
                            <h3 class="text-[#111418] text-lg font-bold leading-tight">
                                Gameplay
                            </h3>
                        </div>
                        <div class="flex flex-col gap-6">
                            <!-- Select Input -->
                            <div class="flex flex-col w-full">
                                <label class="text-[#111418] text-base font-medium leading-normal pb-2"
                                    >Number of Rounds</label
                                >
                                <div class="relative">
                                    <select
                                        class="appearance-none w-full cursor-pointer rounded-xl border border-[#dbe0e6] bg-white h-12 px-4 pr-10 text-[#111418] text-base focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
                                    >
                                        <option value="3">3 Rounds</option>
                                        <option selected="" value="5">5 Rounds</option>
                                        <option value="10">10 Rounds</option>
                                    </select>
                                    <div
                                        class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-[#60758a]"
                                    >
                                        <span class="material-symbols-outlined">expand_more</span>
                                    </div>
                                </div>
                            </div>
                            <!-- Radio Buttons for Timer -->
                            <div class="flex flex-col w-full">
                                <label class="text-[#111418] text-base font-medium leading-normal pb-2"
                                    >Turn Timer</label
                                >
                                <div class="grid grid-cols-3 gap-3">
                                    <label class="group relative cursor-pointer">
                                        <input class="peer sr-only" name="timer" type="radio" />
                                        <div
                                            class="flex items-center justify-center rounded-xl border border-[#dbe0e6] h-11 text-[#111418] text-sm font-medium transition-all peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:bg-gray-50"
                                        >
                                            30s
                                        </div>
                                        <div
                                            class="absolute top-1 right-1 hidden peer-checked:block text-primary"
                                        >
                                            <span class="material-symbols-outlined text-[16px]"
                                                >check_circle</span
                                            >
                                        </div>
                                    </label>
                                    <label class="group relative cursor-pointer">
                                        <input
                                            checked=""
                                            class="peer sr-only"
                                            name="timer"
                                            type="radio"
                                        />
                                        <div
                                            class="flex items-center justify-center rounded-xl border border-[#dbe0e6] h-11 text-[#111418] text-sm font-medium transition-all peer-checked:border-[1.5px] peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:bg-gray-50"
                                        >
                                            60s
                                        </div>
                                        <div
                                            class="absolute top-1 right-1 hidden peer-checked:block text-primary"
                                        >
                                            <span
                                                class="material-symbols-outlined text-[16px] font-bold"
                                                >check_circle</span
                                            >
                                        </div>
                                    </label>
                                    <label class="group relative cursor-pointer">
                                        <input class="peer sr-only" name="timer" type="radio" />
                                        <div
                                            class="flex items-center justify-center rounded-xl border border-[#dbe0e6] h-11 text-[#111418] text-sm font-medium transition-all peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:bg-gray-50"
                                        >
                                            90s
                                        </div>
                                        <div
                                            class="absolute top-1 right-1 hidden peer-checked:block text-primary"
                                        >
                                            <span class="material-symbols-outlined text-[16px]"
                                                >check_circle</span
                                            >
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </section>
                    <hr class="border-[#e5e8eb]" />
                    <!-- Display Section with Toggles -->
                    <section class="space-y-4">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="material-symbols-outlined text-primary">visibility</span>
                            <h3 class="text-[#111418] text-lg font-bold leading-tight">
                                Display
                            </h3>
                        </div>
                        <div class="flex items-center justify-between py-1">
                            <div class="flex flex-col">
                                <span class="text-[#111418] text-base font-medium">Show Scores</span>
                                <span class="text-[#60758a] text-sm"
                                    >Display the leaderboard during the game</span
                                >
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input checked="" class="sr-only peer" type="checkbox" value="" />
                                <div
                                    class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"
                                ></div>
                            </label>
                        </div>
                        <div class="flex items-center justify-between py-1">
                            <div class="flex flex-col">
                                <span class="text-[#111418] text-base font-medium"
                                    >Show Spectators</span
                                >
                                <span class="text-[#60758a] text-sm"
                                    >Allow others to watch your match</span
                                >
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input class="sr-only peer" type="checkbox" value="" />
                                <div
                                    class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"
                                ></div>
                            </label>
                        </div>
                    </section>
                </div>
                <!-- Footer Actions -->
                <div
                    class="p-6 border-t border-[#dbe0e6] bg-gray-50 flex flex-col-reverse sm:flex-row justify-end gap-3"
                >
                    <button
                        class="px-6 py-2.5 rounded-lg border border-[#dbe0e6] text-[#111418] font-medium hover:bg-[#e5e8eb] transition-colors focus:outline-none focus:ring-2 focus:ring-[#dbe0e6] focus:ring-offset-1"
                    >
                        Cancel
                    </button>
                    <button
                        class="px-8 py-2.5 rounded-lg bg-primary text-white font-medium hover:bg-primary-dark shadow-sm shadow-blue-200 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1"
                    >
                        Save Settings
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
